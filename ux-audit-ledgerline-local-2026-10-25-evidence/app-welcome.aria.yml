  - strong: Explore with sample data
  - text: Adds a month of made-up transactions, clearly labelled. Remove them in one click whenever you are ready. Add sample data
- link "See how your data stays private What Ledgerline keeps on this computer, what it reads, and how to erase it. Read the privacy notes":
  - /url: /privacy
  - strong: See how your data stays private
  - text: What Ledgerline keeps on this computer, what it reads, and how to erase it. Read the privacy notes
- heading "What Ledgerline does" [level=2]
- list:
  - listitem: Reads payments from HDFC and ICICI statement PDFs, and from bank alert emails if you connect your mailbox
  - listitem: Sorts spending into categories like food, travel, and shopping
  - listitem: Splits bills with friends so only your share counts
  - listitem: Flags days that go over a daily limit you set
- paragraph: "Free and open source. No account and no tracking: your data stays in a database on this computer, and you can erase it any time from Settings."