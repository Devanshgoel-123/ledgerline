- main:
  - heading "Privacy" [level=1]
  - paragraph: What Ledgerline keeps on your computer, what it reads, the one optional feature that sends data out, and how to take your data with you or erase it.
  - heading "The short version" [level=2]
  - paragraph: Ledgerline runs on your computer. There is no Ledgerline server, no account and no tracking. Your transactions never reach us, because there is nowhere for them to go.
  - heading "Where your data lives" [level=2]
  - paragraph: In a PostgreSQL database inside Docker on your own disk. It holds the payments Ledgerline reads (date, amount, description, UPI ID, merchant, category), the rules, people and bill splits you add, your daily limit, and an optional name and photo. Backups are files in the backups folder, which you control.
  - heading "Who can open it" [level=2]
  - paragraph: "The Ledgerline service listens only on this computer (localhost). It refuses requests addressed to any other name and requests from other websites, so a page you visit cannot read or change your data. There is no sign-in, so anyone using your computer can open Ledgerline: lock your screen when you step away."
  - heading "Statement PDFs" [level=2]
  - paragraph: Read on your computer and then discarded. Ledgerline keeps a fingerprint of each file so the same statement is not imported twice. Statement passwords are used once and never saved.
  - heading "Bank mail (optional)" [level=2]
  - paragraph: If you connect your mailbox, Ledgerline signs in to it over IMAP with an app password you create. The app password is stored encrypted on your computer. Ledgerline searches only mail from your bank’s addresses, reads it, and never sends, moves, deletes or marks mail. Disconnect it in Settings at any time; revoke the app password in your email account to be sure.
  - heading "Telegram (optional, the one exception)" [level=2]
  - paragraph: The Telegram bot is off unless you add a bot token. If you turn it on and link it, reminders and the payments they mention travel through Telegram’s servers, and Ledgerline stores your chat ID and, if you verify it, your mobile number. Unlink it in Settings to remove both.
  - heading "This website" [level=2]
  - paragraph: The website you are reading only explains Ledgerline and how to install it. It has no analytics, cookies for tracking, forms or sign-up, and it never sees your data.
  - heading "Taking your data with you" [level=2]
  - paragraph: Settings › Download all transactions gives you every transaction as a CSV file for Excel or Google Sheets. ./ledgerline backup saves the whole database to a file.
  - heading "Erasing your data" [level=2]
  - paragraph: Settings › Erase everything removes every transaction, rule, mailbox connection and Telegram link, and starts fresh. ./ledgerline uninstall removes Ledgerline and asks before deleting the database.
  - heading "Security notes" [level=2]
  - paragraph: "Ledgerline is not a bank and cannot move money. Your statements and backups are sensitive: keep your computer’s disk encrypted (FileVault, BitLocker or LUKS) and store backups somewhere safe."
  - heading "Questions" [level=2]
  - paragraph:
    - text: Ledgerline is open source, so you can check all of this in the code. Ask questions or report a problem on
    - link "GitHub":
      - /url: https://github.com/Devanshgoel-123/ledgerline/issues
    - text: . Last updated 25 October 2026.
