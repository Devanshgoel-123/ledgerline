# Production overlay — tighter networking, no published DB port, stronger defaults.
# Usage:
#   ./scripts/docker-prod-check.sh --strict
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    # Do not bind host ports in production; reach DB only via the compose network.
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "0"
      ALLOW_ANON_PARSE: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 1g
    # Prefer readiness for LB; Dockerfile HEALTHCHECK stays on /live.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    environment:
      NODE_ENV: production
      LOG_PRETTY: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 768m
