# Ledgerline on your own computer: Postgres + API + web.
# Run it with ./ledgerline start (it creates .env with random secrets on first run).
# Every port is bound to 127.0.0.1, so nothing on your network can reach it.

name: ledgerline

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./ledgerline start to create .env}
      POSTGRES_DB: ledgerline
    volumes:
      - ledgerline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "0"
      DATABASE_URL: ${DATABASE_URL:-postgres://ledgerline:${POSTGRES_PASSWORD}@postgres:5432/ledgerline}
      APP_SECRET: ${APP_SECRET:?Run ./ledgerline start to create .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run ./ledgerline start to create .env}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      # Optional: the Telegram bot is the one feature that sends data off this computer.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *logging

  web:
    build:
      context: ./frontend
      args:
        # The browser on this computer calls the API here.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *logging

volumes:
  # Your data. ./ledgerline uninstall asks before deleting it.
  ledgerline_pg:
