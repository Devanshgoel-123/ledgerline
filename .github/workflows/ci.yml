name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run untrusted code: give the token read access only.
permissions:
  contents: read

# A new push to a pull request cancels its older run; main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: memory
      JWT_SECRET: test-jwt-secret-16chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Store, migration, and rollback tests against a real Postgres.
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://ledgerline:ledgerline@localhost:5432/ledgerline_test
      - name: Production build
        run: npm run build

  frontend:
    name: Frontend tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 `ci` rejects optional wasm bundled deps in this lockfile (same as frontend/Dockerfile).
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: Browser journeys
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:e2e@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      # npm 10 `ci` rejects optional wasm bundled deps in this lockfile (same as frontend/Dockerfile).
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
