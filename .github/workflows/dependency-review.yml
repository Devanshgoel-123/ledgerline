name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Fails a pull request that adds a dependency with a known high or critical vulnerability.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
